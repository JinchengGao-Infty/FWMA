# HS-KAN VI 版本文献调研（v2 — 全 arXiv）
#
# 背景：HS-KAN 将 Horseshoe 先验用于 KAN 的结构化剪枝。MAP 已完成，VI 作扩展。
# VI 核心价值：(1) PIP/SAVS 后验剪枝 (2) 预测不确定性量化
#
# arXiv 搜索注意：关键词用 AND 连接，词太多会空结果。保持 2-3 个核心词。

[research]
name = "hskan-vi-survey-v2"
requirement = """
# HS-KAN-VI：Horseshoe-KAN 的变分推断扩展 — 文献调研需求

## 一、项目背景

我们正在开发 HS-KAN（Horseshoe-KAN），将 Hierarchical Group Horseshoe 先验应用于
KAN（Kolmogorov-Arnold Network）的结构化剪枝。

KAN 用 B-spline 基函数对每条边上的一维函数进行参数化：
  f_{ij}(x) = Σ_k c_{ij,k} · B_k(x)
每条边的样条系数向量 c_{ij} = (c_{ij,1}, ..., c_{ij,K}) 构成一个"组"。

**MAP 版本已完成**（NeurIPS 投稿），核心贡献：
- Horseshoe 先验的三层尺度结构（全局 τ、边级 γ、系数级 λ）与 KAN 的三层拓扑
  （层-边-系数）存在 structural alignment
- 非中心化参数化：c_{ij,k} = τ · γ_{ij} · λ_{ij,k} · v_{ij,k}，其中 v ~ N(0,1)
- 自适应正则化 + 结构剪枝，来自同一个 insight 的两面
- 实验结果：7 个合成数据集上 6 胜 1 负，特征选择 recall = 1.0

**现在要做 VI（变分推断）扩展**，这是本次调研的核心目标。

## 二、VI 版本的技术方案

### 2.1 核心思想
MAP 只给点估计，VI 给后验分布。区别在剪枝决策时特别重要：
- MAP：γ_{ij} = 0.02，该不该删？需要人为设阈值
- VI：P(γ_{ij} > 0.01 | D) = 0.03，只有 3% 概率有用 → 删

### 2.2 数学建模
联合分布（与 MAP 共享非中心化参数化）：
  c_{ij,k} = v_{ij,k} · τ · γ_{ij} · λ_{ij,k}
  τ ~ C+(0,1), γ_{ij} ~ C+(0,1), λ_{ij,k} ~ C+(0,1), v_{ij,k} ~ N(0,1)

ELBO 目标：
  L(φ) = E_q[log p(D|Θ)] - KL(q_φ(Θ) || p(Θ))

由于 Half-Cauchy 与 KAN 非线性不可共轭，KL 无闭式解，用 Monte Carlo + 重参数化估计。

### 2.3 变分分布选择
- 方案 A（起步）：均值场高斯（Mean-field Gaussian），对尺度参数在 log 空间做变分
- 方案 B（进阶）：低秩多元高斯（Low-rank MVN），只对尺度参数用
- 方案 C（高级）：Normalizing Flows，处理 Horseshoe 的尖峰厚尾后验

### 2.4 轻量 VI 折中方案（推荐）
只对尺度参数（τ, γ）做 VI，v 做点估计（MAP）。好处：
- 参数量只增加尺度参数的 2 倍（很少）
- 采样方差大幅降低
- 仍然能得到 γ 的后验 → 支持 PIP/SAVS

### 2.5 后验剪枝决策
- PIP（Posterior Inclusion Probability）：P(||c_{ij}|| > ε | D) > 0.5 → 保留
- SAVS（Signal Adaptive Variable Selector）：对后验均值做 K-means(K=2)，小类删除
- Fine-tune：固定 mask，去掉先验，小学习率微调

### 2.6 训练技巧
- Warm-up：前 20% steps 线性释放 prior strength
- 梯度裁剪：max_norm=5.0
- KL 退火（可选）：前期降低 KL 项权重
- 训练时 num_particles=1，评估时增加到 10-50

### 2.7 已有实现
已用 Pyro 实现了完整的 VI 训练框架（hs_kan_vi/），包括：
- probabilistic_model.py：Pyro 概率模型，非中心化参数化
- vi_train.py：SVI + Trace_ELBO 训练
- vi_pruning.py：PIP/SAVS 后验剪枝
- vi_predict.py：后验预测

## 三、调研需要回答的具体问题

### Q1: Horseshoe + VI 的理论与工程
- Horseshoe 先验在 VI 框架下的收敛性和后验一致性如何？
- Non-centered parameterization（Fadeout）在 VI 中的必要性和效果？
- 均值场高斯近似 Horseshoe 的尖峰厚尾后验，会导致多严重的 under-dispersion？
- 有没有比 AutoNormal 更好的变分分布选择？

### Q2: Bayesian / Variational KAN（直接竞品）
- InfinityKAN（arXiv 2507.02466）等 Variational KAN 工作的具体方法和效果？
- 其他 KAN + Bayesian 的工作（BayesKAN、SVGP-KAN 等）？
- 这些工作跟我们的 Horseshoe 方案有什么本质区别？

### Q3: Bayesian 神经网络剪枝/稀疏化
- VI 做剪枝 vs MAP 做剪枝，文献中的对比结论？
- Spike-and-slab vs Horseshoe vs Variational Dropout 在结构化剪枝中的优劣？
- Over-pruning 问题在 Variational BNN 中有多严重？怎么缓解？

### Q4: 收缩先验（Shrinkage Priors）最新进展
- Horseshoe vs Horseshoe+ vs Finnish Horseshoe vs R2D2 的理论比较？
- 这些先验在深度学习（不限于 KAN）中的实际应用效果？
- 全局尺度 τ 的设定（Piironen & Vehtari 启发式）在深度模型中是否适用？

### Q5: 不确定性量化（UQ）方法论
注意：只关心 UQ 的方法论和理论，不关心具体应用领域（物理/医学/遥感等）。
- aleatoric vs epistemic uncertainty 的分解方法？
- 后验预测校准（calibration）的评估指标和改进方法？
- VI 型 BNN 的 UQ 质量与 MCMC/Deep Ensemble 的对比？

## 四、筛选标准（给 screener 的明确指引）

### 标记为 high 的条件（必须满足至少一条）：
1. 论文直接研究 KAN + Bayesian/Variational/Pruning/Uncertainty
2. 论文研究 Horseshoe/shrinkage prior 在神经网络中的应用
3. 论文研究 Bayesian 神经网络的结构化剪枝/稀疏化方法
4. 论文研究 SAVS/PIP/后验变量选择方法
5. 论文研究 non-centered parameterization / Fadeout 在 VI 中的应用
6. 论文是 shrinkage prior 的重要理论工作（Horseshoe+, Finnish Horseshoe, R2D2 等）

### 标记为 medium 的条件：
1. 论文研究 Variational Dropout / Bayesian compression 等相关但非核心方法
2. 论文是 UQ 方法论的综述或重要基准（不是某个应用领域的 UQ）
3. 论文研究 Bayesian 方法在金融/信用评分中的变量选择或不确定性量化

### 标记为 low 的条件（应排除）：
1. 论文只是在某个应用领域（物理/医学/遥感/NLP 等）使用了 BNN 或 UQ，没有方法创新
2. 论文研究的是非 Bayesian 的剪枝方法（magnitude pruning, SNIP 等），除非直接与 Bayesian 方法对比
3. 论文与 KAN、Horseshoe、VI 剪枝都没有直接关系
"""

